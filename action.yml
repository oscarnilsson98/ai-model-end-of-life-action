name: "AI Model End-of-Life Check"
description: "Flag AI models your repo depends on that are approaching end-of-life, sourced from deprecations.info."
author: "oscarnilsson98"

branding:
  icon: "sunset"
  color: "orange"

inputs:
  models:
    description: 'JSON array of models to check — objects `[{"id":"gpt-5.2","provider":"openai"}]` or bare ids `["gpt-5.2"]`. `provider` is optional but recommended: without it a model matches any provider (e.g. an Azure-hosted namesake).'
    required: true
  days-before-shutdown:
    description: "Flag a model when its shutdown date is within this many days (or already passed)."
    required: false
    default: "90"
  fail-within-days:
    description: "Fail the step when a model is within this many days of shutdown (or already past it). Leave unset to only warn. Keep it below `days-before-shutdown` to warn early and fail late."
    required: false
    default: ""
  feed-url:
    description: "Mirror of the deprecations.info feed — for air-gapped runners, an outage, or pinning a vendored snapshot. Must serve the same JSON schema."
    required: false
    default: "https://deprecations.info/v1/deprecations.json"
  max-feed-age-days:
    description: "Fail when the feed's newest entry was observed longer ago than this — a feed that stopped updating reports a permanent all-clear. Set to empty to disable."
    required: false
    default: "30"
  slack-webhook:
    description: "Optional Slack incoming-webhook URL; when set, findings are posted to it."
    required: false
    default: ""
  job-summary:
    description: "Write a findings table to the GitHub Actions job summary."
    required: false
    default: "true"

outputs:
  findings:
    description: "JSON array of matched deprecations (id, provider, shutdownDate, daysUntilShutdown, replacementModels, url, context), soonest shutdown first."
  has-findings:
    description: "'true' when at least one model is within the shutdown window."

runs:
  using: "node24"
  main: "dist/index.js"
