name: "AI Model Lifecycle Monitor"
description: "Discover AI model usage in committed repository code and warn before known model shutdowns."
author: "oscarnilsson98"

branding:
  icon: "sunset"
  color: "orange"

inputs:
  warn-within-days:
    description: "Override the warning horizon. Omit to use checked-in policy or the built-in 180-day default."
    required: false
  fail-within-days:
    description: "Enable enforcement and fail for definite production evidence inside this shutdown horizon. Omit for warning-only monitoring."
    required: false
  allow-partial:
    description: "Allow an enforced run to succeed when declared assessment coverage is partial. Omit to use checked-in policy or false."
    required: false
  slack-webhook:
    description: "Optional HTTPS Slack incoming webhook for trusted scheduled, manual, and push snapshots. Never sent on pull requests or merge groups."
    required: false
  notification-failure-mode:
    description: "Whether configured Slack delivery failure should fail the step (`fail`) or only warn (`warn`)."
    required: false
    default: "fail"

outputs:
  result:
    description: "Lifecycle result: no-actionable-risk, advisory, blocking, or unknown."
  baseline-result:
    description: "Trusted base result for a pull request or merge group; empty otherwise."
  target-result:
    description: "Effective target result for a pull request or merge group; empty otherwise."
  scan-status:
    description: "Assessment coverage: complete, partial, or failed. Independent from result."
  baseline-scan-status:
    description: "Base assessment coverage on comparison events; empty otherwise."
  target-scan-status:
    description: "Target assessment coverage on comparison events; empty otherwise."
  comparison-status:
    description: "Base/target comparison health: available, partial, unavailable, or not-applicable."
  exit-reason:
    description: "Final step decision: none, assessment-failed, trusted-base-unavailable, policy-breach, partial-disallowed, or notification-failed."
  target-kind:
    description: "Git target used: commit, synthetic-merge, synthetic-merge-uncompared, merge-group, or raw-head-fallback."
  evidence-health:
    description: "Worst freshness state among repository-supplied evidence claims."
  evidence-sources:
    description: "Bounded JSON array describing assessed repository and checked-in evidence sources."
  evidence-facts:
    description: "Bounded JSON array of detector evidence facts. See report-path for the complete report."
  lifecycle-findings:
    description: "Bounded JSON array of lifecycle findings with policy outcome and comparison delta."
  unresolved-references:
    description: "Bounded JSON array of dynamic, ambiguous, or otherwise unresolved model references."
  counts:
    description: "JSON object containing evidence, finding, outcome, scope, and resolution counts."
  source-feed-sha256:
    description: "SHA-256 of the exact upstream lifecycle-feed bytes."
  normalized-feed-sha256:
    description: "Order-stable SHA-256 of the validated typed lifecycle feed."
  active-records-sha256:
    description: "SHA-256 of active lifecycle records after explicit supersession."
  feed-adapter-manifest-sha256:
    description: "SHA-256 of the reviewed adapter manifest used for the upstream feed."
  detector-manifest-sha256:
    description: "SHA-256 of the versioned detector/rule manifest."
  evidence-fingerprint:
    description: "Stable identity of the assessed evidence-fact set."
  finding-fingerprint:
    description: "Stable identity of the complete finding set."
  scan-fingerprint:
    description: "Stable identity of the selected Git target and scan coverage."
  alert-fingerprint:
    description: "Stable identity of current blocking and advisory lifecycle findings."
  output-truncated:
    description: "true when detailed action outputs were compacted; the local JSON report remains complete."
  report-path:
    description: "Runner-local path to the complete v3 JSON assessment report."
  notification-status:
    description: "Slack delivery status: disabled, skipped, sent, or failed."
  notification-reason:
    description: "Bounded explanation for the notification decision."

runs:
  using: "node24"
  main: "dist/index.js"
