name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Verify dist/ is in sync with src/
        run: git diff --exit-code -- dist || { echo "::error::dist/ is stale — run \`bun run build\` and commit the result."; exit 1; }

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: eol
        uses: ./
        with:
          models: '[{"id":"gpt-4","provider":"openai"},{"id":"definitely-not-a-real-model","provider":"openai"}]'
          days-before-shutdown: "3650"
      - name: Assert the retired model was flagged
        env:
          FINDINGS: ${{ steps.eol.outputs.findings }}
          HAS_FINDINGS: ${{ steps.eol.outputs.has-findings }}
        run: |
          test "$HAS_FINDINGS" = "true" || { echo "::error::Expected gpt-4 to be flagged within a 10-year window."; exit 1; }
          echo "$FINDINGS" | grep -q '"id":"gpt-4"' || { echo "::error::findings output did not contain gpt-4."; exit 1; }

  # Every input here is hyphenated. The runner exposes those as INPUT_FEED-URL, not INPUT_FEED_URL,
  # so reading the wrong name makes them silently no-op — these jobs are the only thing that catches it.
  hyphenated-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: narrow-window
        uses: ./
        with:
          models: '[{"id":"gpt-4","provider":"openai"}]'
          days-before-shutdown: "1"
      - name: days-before-shutdown must narrow the window
        run: test "${{ steps.narrow-window.outputs.has-findings }}" = "false"

      - id: gate
        continue-on-error: true
        uses: ./
        with:
          models: '[{"id":"gpt-4","provider":"openai"}]'
          days-before-shutdown: "3650"
          fail-within-days: "3650"
      - name: fail-within-days must fail the step
        run: test "${{ steps.gate.outcome }}" = "failure"

      - id: stale
        continue-on-error: true
        uses: ./
        with:
          models: '[{"id":"gpt-4","provider":"openai"}]'
          max-feed-age-days: "0"
      - name: max-feed-age-days must reject a feed older than the limit
        run: test "${{ steps.stale.outcome }}" = "failure"

      - name: Serve a mirror fixture over HTTP
        run: |
          mkdir -p /tmp/mirror
          printf '[{"provider":"OpenAI","model_id":"only-in-this-mirror","shutdown_date":"%s","last_observed":"%s"}]' \
            "$(date -u -d '+10 days' +%F)" "$(date -u +%F)" > /tmp/mirror/feed.json
          python3 -m http.server 8123 --directory /tmp/mirror >/dev/null 2>&1 &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:8123/feed.json >/dev/null && exit 0; sleep 0.5; done
          echo "::error::Mirror fixture server never came up."; exit 1

      - id: custom-feed
        uses: ./
        with:
          models: '[{"id":"only-in-this-mirror","provider":"openai"}]'
          feed-url: "http://127.0.0.1:8123/feed.json"
      - name: feed-url must be read from the mirror, not the default feed
        run: test "${{ steps.custom-feed.outputs.has-findings }}" = "true"

  # Consumes the published ref the way a third party does — run this after moving the `v1` tag.
  published-ref:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - id: eol
        uses: oscarnilsson98/ai-model-end-of-life-action@v1
        with:
          models: '[{"id":"gpt-4","provider":"openai"}]'
          days-before-shutdown: "3650"
      - run: test "${{ steps.eol.outputs.has-findings }}" = "true"
