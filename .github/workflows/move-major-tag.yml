name: Validate published release and move major tag

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-major-tag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release source and bundle
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      major: ${{ steps.release.outputs.major }}
      sha: ${{ steps.release.outputs.sha }}
      tag_ref: ${{ steps.release.outputs.tag_ref }}
    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve and validate the stable release tag
        id: release
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use the exact stable vX.Y.Z format without leading zeroes." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "The requested tag does not exist in the repository." >&2
            exit 1
          fi

          tag_ref="$(git rev-parse --verify "refs/tags/$TAG")"
          tag_sha="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git checkout --detach "$tag_sha"

          default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git show-ref --verify --quiet "$default_ref"; then
            echo "The repository default branch was not fetched." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_sha" "$default_ref"; then
            echo "The release commit must be reachable from the repository default branch." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "major=${TAG%%.*}" >> "$GITHUB_OUTPUT"
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "tag_ref=$tag_ref" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Require immutable external action references
        run: bun .github/scripts/check-action-pins.ts

      - name: Verify the exact Bun toolchain
        run: bun run verify-toolchain

      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck CI helpers
        run: bunx --bun tsc --project .github/tsconfig.json

      - name: Run deterministic unit tests
        run: bun run test

      - name: Rebuild the action bundle
        run: bun run build

      - name: Verify the released dist is committed and reproducible
        shell: bash
        run: |
          if ! git diff --exit-code -- dist; then
            echo "The release bundle differs from a clean build." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all -- dist)" ]]; then
            echo "The release contains untracked dist output." >&2
            exit 1
          fi

      - name: Validate the reviewed live feed adapter
        run: bun .github/scripts/assert-live-feed.ts

      - name: Run the checked-in zero-input release bundle hermetically against the exact release commit
        id: lifecycle
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          NODE_OPTIONS: --require=${{ github.workspace }}/.github/scripts/hermetic-feed-preload.cjs
        run: |
          set -Eeuo pipefail
          export GITHUB_SHA="$RELEASE_SHA"
          node dist/index.js

      - name: Assert the v3 release result, provenance, and complete report
        shell: bash
        env:
          RESULT: ${{ steps.lifecycle.outputs.result }}
          BASELINE_RESULT: ${{ steps.lifecycle.outputs.baseline-result }}
          TARGET_RESULT: ${{ steps.lifecycle.outputs.target-result }}
          SCAN_STATUS: ${{ steps.lifecycle.outputs.scan-status }}
          COMPARISON_STATUS: ${{ steps.lifecycle.outputs.comparison-status }}
          EXIT_REASON: ${{ steps.lifecycle.outputs.exit-reason }}
          TARGET_KIND: ${{ steps.lifecycle.outputs.target-kind }}
          EVIDENCE_HEALTH: ${{ steps.lifecycle.outputs.evidence-health }}
          COUNTS: ${{ steps.lifecycle.outputs.counts }}
          SOURCE_FEED_SHA256: ${{ steps.lifecycle.outputs.source-feed-sha256 }}
          NORMALIZED_FEED_SHA256: ${{ steps.lifecycle.outputs.normalized-feed-sha256 }}
          ACTIVE_RECORDS_SHA256: ${{ steps.lifecycle.outputs.active-records-sha256 }}
          ADAPTER_MANIFEST_SHA256: ${{ steps.lifecycle.outputs.feed-adapter-manifest-sha256 }}
          DETECTOR_MANIFEST_SHA256: ${{ steps.lifecycle.outputs.detector-manifest-sha256 }}
          SCAN_FINGERPRINT: ${{ steps.lifecycle.outputs.scan-fingerprint }}
          ALERT_FINGERPRINT: ${{ steps.lifecycle.outputs.alert-fingerprint }}
          OUTPUT_TRUNCATED: ${{ steps.lifecycle.outputs.output-truncated }}
          REPORT_PATH: ${{ steps.lifecycle.outputs.report-path }}
          NOTIFICATION_STATUS: ${{ steps.lifecycle.outputs.notification-status }}
          NOTIFICATION_REASON: ${{ steps.lifecycle.outputs.notification-reason }}
          EVENT_NAME: ${{ github.event_name }}
        run: bun .github/scripts/assert-e2e.ts

  promote-major-tag:
    name: Promote immutable release to major tag
    needs: validate-release
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Require an immutable published GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if ! release_state="$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/releases/tags/$TARGET_TAG" \
              --jq '[.tag_name, (.draft | tostring), (.prerelease | tostring), ((.immutable // false) | tostring), (.published_at // "")] | @tsv'
          )"; then
            echo "The validated tag does not have an accessible GitHub Release." >&2
            exit 1
          fi
          IFS=$'\t' read -r release_tag draft prerelease immutable published_at <<< "$release_state"
          if [[ "$release_tag" != "$TARGET_TAG" || "$draft" != "false" || "$prerelease" != "false" || "$immutable" != "true" || -z "$published_at" ]]; then
            echo "Major-tag promotion requires a published, stable, immutable GitHub Release for the validated tag." >&2
            exit 1
          fi

      - name: Check out the complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Move the major tag without allowing a version regression
        shell: bash
        env:
          TARGET_TAG: ${{ needs.validate-release.outputs.tag }}
          TARGET_TAG_REF: ${{ needs.validate-release.outputs.tag_ref }}
          TARGET_SHA: ${{ needs.validate-release.outputs.sha }}
          MAJOR_TAG: ${{ needs.validate-release.outputs.major }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          git fetch --force --tags origin

          actual_ref="$(git rev-parse --verify "refs/tags/$TARGET_TAG")"
          actual_sha="$(git rev-parse --verify "refs/tags/$TARGET_TAG^{commit}")"
          if [[ "$actual_ref" != "$TARGET_TAG_REF" || "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "The validated release tag changed before promotion; refusing to continue." >&2
            exit 1
          fi
          default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git show-ref --verify --quiet "$default_ref" ||
             ! git merge-base --is-ancestor "$TARGET_SHA" "$default_ref"; then
            echo "The release commit is no longer reachable from the repository default branch." >&2
            exit 1
          fi

          current_ref=""
          current_sha=""
          if git show-ref --verify --quiet "refs/tags/$MAJOR_TAG"; then
            current_ref="$(git rev-parse --verify "refs/tags/$MAJOR_TAG")"
            current_sha="$(git rev-parse --verify "refs/tags/$MAJOR_TAG^{commit}")"
          fi
          if [[ "$current_sha" == "$TARGET_SHA" ]]; then
            echo "$MAJOR_TAG already points at $TARGET_TAG ($TARGET_SHA)."
            exit 0
          fi

          if [[ -n "$current_sha" ]]; then
            current_release_tag="$(
              git tag --points-at "$current_sha" --list "$MAJOR_TAG.*.*" |
                grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
                sort -V |
                tail -n 1 || true
            )"
            if [[ -z "$current_release_tag" ]]; then
              echo "The existing major tag does not point at a stable release tag; refusing a blind force-update." >&2
              exit 1
            fi
            newest="$(printf '%s\n%s\n' "$current_release_tag" "$TARGET_TAG" | sort -V | tail -n 1)"
            if [[ "$newest" != "$TARGET_TAG" ]]; then
              echo "Refusing to move $MAJOR_TAG backwards from $current_release_tag to $TARGET_TAG." >&2
              exit 1
            fi
          fi

          if [[ -n "$current_ref" ]]; then
            git update-ref "refs/tags/$MAJOR_TAG" "$TARGET_SHA" "$current_ref"
            major_lease="refs/tags/$MAJOR_TAG:$current_ref"
          else
            git update-ref "refs/tags/$MAJOR_TAG" "$TARGET_SHA"
            major_lease="refs/tags/$MAJOR_TAG:"
          fi
          git push --force-with-lease="$major_lease" origin "refs/tags/$MAJOR_TAG"
          echo "$MAJOR_TAG now points at $TARGET_TAG ($TARGET_SHA)."
