name: Upstream feed contract

on:
  schedule:
    - cron: "37 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-feed-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-live-feeds:
    name: Validate live raw and JSON Feed forms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Validate both live upstream feed contracts
        run: bun .github/scripts/assert-live-feed.ts
