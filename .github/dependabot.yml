version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # Types describe the runtime they check against. The action runs on node24, and the
    # Bun types follow the exact Bun pinned in packageManager, so neither moves ahead of it.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/bun"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      bun-development-dependencies:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:31"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
